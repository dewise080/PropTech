<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Popup — {{ title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Ubuntu', sans-serif; box-sizing: border-box; }

        /* ── Leaflet popup replica ── */
        .leaflet-popup-content-wrapper {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.25);
            padding: 0;
            overflow: hidden;
            display: inline-block;
        }
        .leaflet-popup-content {
            margin: 13px 19px;
            min-width: 160px;
            max-width: 260px;
        }
        .popup-title {
            font-weight: 700;
            font-size: 14px;
            color: #1f2937;
            margin-bottom: 6px;
        }
        .popup-info {
            font-size: 12px;
            color: #4b5563;
            margin: 3px 0;
        }
        .popup-distance {
            color: #2563eb;
            font-weight: 600;
        }
        .leaflet-popup-tip-container {
            width: 40px;
            height: 20px;
            margin: 0 auto;
            overflow: hidden;
        }
        .leaflet-popup-tip {
            width: 17px;
            height: 17px;
            background: #fff;
            box-shadow: 0 3px 14px rgba(0,0,0,0.25);
            margin: -8px auto 0;
            transform: rotate(45deg);
        }

        /* ── Code block ── */
        .code-block {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.7;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            white-space: pre;
            overflow-x: auto;
        }
        .code-tag   { color: #7dd3fc; }
        .code-attr  { color: #fbbf24; }
        .code-val   { color: #86efac; }
        .code-class { color: #c084fc; }

        /* ── Field list ── */
        .field-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .field-row:hover:not(.locked) { background: #f1f5f9; }
        .field-row.locked { background: #f8fafc; cursor: default; opacity: 0.85; }
        .field-row input[type=checkbox] {
            margin-top: 2px;
            accent-color: #2563eb;
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .field-row.locked input[type=checkbox] { cursor: not-allowed; }
        .field-key   { font-weight: 600; font-size: 13px; color: #1e293b; }
        .field-val   { font-size: 11px; color: #94a3b8; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
        .badge-virtual { font-size: 10px; background: #dbeafe; color: #1d4ed8; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
        .badge-locked  { font-size: 10px; background: #e2e8f0; color: #64748b; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

<!-- Top bar -->
<div class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between flex-shrink-0">
    <div>
        <span class="text-gray-400 text-sm">Map Viewer</span>
        <span class="mx-2 text-gray-300">/</span>
        <span class="font-semibold text-gray-800 text-sm">Configure Popup — {{ title }}</span>
    </div>
    <form method="post" id="main-form">
        {% csrf_token %}
        <div id="hidden-fields"></div>
        <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
            Generate Map →
        </button>
    </form>
</div>

<!-- Main canvas -->
<div class="flex flex-1 overflow-hidden">

    <!-- LEFT: Preview panel -->
    <div class="w-1/2 border-r border-gray-200 bg-gray-50 flex flex-col overflow-hidden">

        <!-- Code block -->
        <div class="p-5 border-b border-gray-200">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Popup HTML Template</p>
            <div class="code-block" id="code-display"></div>
        </div>

        <!-- Live rendered preview -->
        <div class="flex-1 flex flex-col items-center justify-center p-8">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-6">Live Preview</p>
            <div>
                <div class="leaflet-popup-content-wrapper">
                    <div class="leaflet-popup-content" id="popup-preview"></div>
                </div>
                <div class="leaflet-popup-tip-container">
                    <div class="leaflet-popup-tip"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT: Field picker -->
    <div class="w-1/2 flex flex-col overflow-hidden bg-white">
        <div class="px-6 py-4 border-b border-gray-100 flex-shrink-0">
            <p class="font-semibold text-gray-800">Select Fields</p>
            <p class="text-xs text-gray-400 mt-0.5">Choose which data appears in each map popup</p>
        </div>
        <div class="flex-1 overflow-y-auto px-4 py-3">
            {% for field in fields %}
            <label class="field-row {% if field.locked %}locked{% endif %}" for="field-{{ field.key }}">
                <input type="checkbox"
                       class="field-checkbox"
                       id="field-{{ field.key }}"
                       value="{{ field.key }}"
                       {% if field.default %}checked{% endif %}
                       {% if field.locked %}disabled{% endif %}>
                <div class="min-w-0 flex-1">
                    <div class="field-key">
                        {{ field.key }}
                        {% if field.locked %}<span class="badge-locked">base</span>{% endif %}
                        {% if field.key == "title" or field.key == "distance" or field.key == "category" %}
                                        <span class="badge-virtual">auto</span>
                        {% endif %}
                        {% if field.key == "link" %}
                        <span class="badge-virtual" style="background:#dcfce7;color:#166534;">→ title</span>
                        {% endif %}
                        {% if field.key == "phone" %}
                        <span class="badge-virtual" style="background:#dcfce7;color:#166534;"><i class="fa-brands fa-whatsapp"></i></span>
                        {% endif %}
                        {% if field.key == "address" %}
                        <span class="badge-virtual" style="background:#fee2e2;color:#991b1b;"><i class="fa-solid fa-location-dot"></i></span>
                        {% endif %}
                        {% if field.key == "web_site" %}
                        <span class="badge-virtual" style="background:#ede9fe;color:#5b21b6;"><i class="fa-solid fa-globe"></i></span>
                        {% endif %}
                        {% if field.key == "thumbnail" %}
                        <span class="badge-virtual" style="background:#fef3c7;color:#92400e;"><i class="fa-solid fa-image"></i></span>
                        {% endif %}
                    </div>
                    <div class="field-val">{{ field.sample }}</div>
                </div>
            </label>
            {% endfor %}
        </div>
    </div>
</div>

{{ sample_json|json_script:"sample-data" }}
<script>
    const SAMPLE = JSON.parse(document.getElementById('sample-data').textContent);

    // Fields that modify another field's rendering instead of adding their own row.
    // Mirror this set in file_map.html whenever a new smart behavior is added.
    const MODIFIERS = new Set(['link', 'phone', 'address', 'web_site', 'thumbnail',
                               'review_count', 'review_rating', 'user_reviews']);

    function getChecked() {
        return Array.from(document.querySelectorAll('.field-checkbox:checked')).map(cb => cb.value);
    }

    function sampleVal(field) {
        if (field === 'title')    return SAMPLE.title || SAMPLE.name || 'Name';
        if (field === 'distance') return '410m';
        const v = SAMPLE[field];
        if (v === null || v === undefined || v === '') return '—';
        return String(v).slice(0, 60);
    }

    // ── Code block renderer ──────────────────────────────────────────
    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function tag(name, cls, inner, extra) {
        let attrs = cls ? ` <span class="code-attr">class</span>=<span class="code-val">"${esc(cls)}"</span>` : '';
        if (extra) attrs += extra;
        return `<span class="code-tag">&lt;${esc(name)}</span>${attrs}<span class="code-tag">&gt;</span>${inner}<span class="code-tag">&lt;/${esc(name)}&gt;</span>`;
    }

    function renderCode(fields) {
        const hasLink = fields.includes('link');
        const lines = [];
        const consumed = new Set();
        fields.forEach(f => {
            if (MODIFIERS.has(f) || consumed.has(f)) return;
            if (f === 'title') {
                if (hasLink) {
                    const aAttrs = ` <span class="code-attr">href</span>=<span class="code-val">"{link}"</span>`
                                 + ` <span class="code-attr">target</span>=<span class="code-val">"_blank"</span>`;
                    lines.push('  ' + tag('div', 'popup-title',
                        tag('a', '', '<span class="code-val">{title}</span>', aAttrs)));
                } else {
                    lines.push('  ' + tag('div', 'popup-title', `<span class="code-val">{title}</span>`));
                }
            } else if (f === 'category' || f === 'distance') {
                const hasCat  = fields.includes('category');
                const hasDist = fields.includes('distance');
                const inner   = (hasCat  ? tag('strong', '', '<span class="code-val">{category}</span>') : '')
                              + (hasDist ? tag('span', 'popup-distance', '📍 <span class="code-val">{auto}</span> away') : '');
                lines.push('  ' + tag('div', 'popup-info', inner,
                    ` <span class="code-attr">style</span>=<span class="code-val">"display:flex;justify-content:space-between;"</span>`));
                consumed.add('category');
                consumed.add('distance');
            } else {
                lines.push('  ' + tag('div', 'popup-info',
                    `${esc(f)}: ` + tag('strong', '', `<span class="code-val">{${esc(f)}}</span>`)));
            }
        });
        // Icon bar in code
        let iconParts = [];
        if (fields.includes('phone'))    iconParts.push(`    ` + tag('a', '', tag('i', 'fa-brands fa-whatsapp', ''), ` <span class="code-attr">href</span>=<span class="code-val">"https://wa.me/{phone}"</span>`));
        if (fields.includes('address'))  iconParts.push(`    ` + tag('span', 'addr-wrap', tag('i', 'fa-solid fa-location-dot', '') + tag('span', 'addr-tooltip', '<span class="code-val">{address}</span>')));
        if (fields.includes('web_site')) iconParts.push(`    ` + tag('a', '', tag('i', 'fa-solid fa-globe', ''), ` <span class="code-attr">href</span>=<span class="code-val">"{web_site}"</span>`));
        if (iconParts.length) {
            lines.push('  ' + tag('div', 'popup-icon-bar', '\n' + iconParts.join('\n') + '\n  '));
        }

        const inner = lines.length ? '\n' + lines.join('\n') + '\n' : '';
        return tag('div', 'leaflet-popup-content-wrapper',
               '\n  ' + tag('div', 'leaflet-popup-content', inner) + '\n');
    }

    // ── Live popup preview renderer ──────────────────────────────────
    function renderPreview(fields) {
        const hasLink = fields.includes('link');
        let html = '';
        const consumed = new Set();
        fields.forEach(f => {
            if (MODIFIERS.has(f) || consumed.has(f)) return;
            if (f === 'title') {
                const name = sampleVal('title');
                if (hasLink && SAMPLE.link) {
                    html += `<div class="popup-title">
                                 <a href="${SAMPLE.link}" target="_blank" rel="noopener noreferrer"
                                    style="color:inherit;text-decoration:none;border-bottom:1px solid #d1d5db;">
                                     ${name}
                                 </a>
                             </div>`;
                } else {
                    html += `<div class="popup-title">${name}</div>`;
                }
            } else if (f === 'category' || f === 'distance') {
                const cat  = fields.includes('category') ? (sampleVal('category') || '') : '';
                const dist = fields.includes('distance') ? '410m' : '';
                html += `<div class="popup-info" style="display:flex;justify-content:space-between;align-items:center;">
                             ${cat  ? `<strong style="color:#111;">${cat}</strong>` : '<span></span>'}
                             ${dist ? `<span class="popup-distance">📍 <strong>${dist}</strong> away</span>` : ''}
                         </div>`;
                consumed.add('category');
                consumed.add('distance');
            } else {
                html += `<div class="popup-info">${f}: <strong>${sampleVal(f)}</strong></div>`;
            }
        });
        // Thumbnail in preview
        if (fields.includes('thumbnail') && SAMPLE.thumbnail) {
            const src = String(SAMPLE.thumbnail).startsWith('//')
                ? 'https:' + SAMPLE.thumbnail
                : SAMPLE.thumbnail;
            html += `<img src="${src}" alt="thumbnail"
                          style="width:100%;margin-top:8px;border-radius:8px;display:block;max-height:110px;object-fit:cover;">`;
        }

        // Icon bar (4 icons, space-evenly)
        let icons = '';
        if (fields.includes('phone') && SAMPLE.phone) {
            const digits = String(SAMPLE.phone).replace(/\D/g, '');
            icons += `<a href="tel:+${digits}" style="text-decoration:none;" title="Call">
                          <i class="fa-solid fa-phone" style="color:#0ea5e9;font-size:20px;"></i>
                      </a>
                      <a href="https://wa.me/${digits}" target="_blank" style="text-decoration:none;" title="WhatsApp">
                          <i class="fa-brands fa-whatsapp" style="color:#25d366;font-size:20px;"></i>
                      </a>`;
        }
        if (fields.includes('address') && SAMPLE.address) {
            icons += `<span title="${SAMPLE.address}" style="cursor:pointer;">
                          <i class="fa-solid fa-location-dot" style="color:#ef4444;font-size:20px;"></i>
                      </span>`;
        }
        if (fields.includes('web_site') && SAMPLE.web_site) {
            icons += `<a href="${SAMPLE.web_site}" target="_blank" style="text-decoration:none;" title="Website">
                          <i class="fa-solid fa-globe" style="color:#6366f1;font-size:20px;"></i>
                      </a>`;
        }
        if (icons) {
            html += `<div style="display:flex;justify-content:space-evenly;align-items:center;margin-top:8px;padding:8px 4px 2px;border-top:1px solid #f1f5f9;">${icons}</div>`;
        }

        // Reviews section
        const reviewCount  = SAMPLE.review_count;
        const reviewRating = SAMPLE.review_rating;
        const reviews      = Array.isArray(SAMPLE.user_reviews) ? SAMPLE.user_reviews : [];

        if (reviewCount || reviewRating) {
            let revHtml = `<div style="border-top:1px solid #f1f5f9;margin-top:8px;padding-top:8px;">`;

            revHtml += `<div style="font-size:12px;color:#4b5563;line-height:1.5;">`;
            if (reviewCount && reviewRating) {
                revHtml += `<strong>${reviewCount}</strong> people gave it a <strong>⭐ ${reviewRating}</strong>`;
            } else if (reviewRating) {
                revHtml += `Rated <strong>⭐ ${reviewRating}</strong>`;
            } else {
                revHtml += `<strong>${reviewCount}</strong> reviews`;
            }
            revHtml += `</div>`;

            if (reviews.length > 0) {
                revHtml += `<div style="font-size:11px;color:#2563eb;margin-top:4px;cursor:pointer;text-decoration:underline;">Show reviews ▾</div>`;
                revHtml += `<div style="margin-top:6px;">`;
                reviews.forEach(r => {
                    const picRaw = r.ProfilePicture || r.profile_picture || r.profile_photo || r.avatar || r.image || '';
                    const pic    = picRaw ? (picRaw.startsWith('//') ? 'https:' + picRaw : picRaw) : '';
                    const name   = r.Name || r.name || r.author || 'Anonymous';
                    const rating = r.Rating || r.rating || r.stars || '';
                    const text   = r.Description || r.description || r.text || r.review || r.snippet || '';
                    const snippet = text.length > 90 ? text.slice(0, 90) + '…' : text;

                    const avatar = pic
                        ? `<img src="${pic}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;">`
                        : `<div style="width:28px;height:28px;border-radius:50%;background:#e2e8f0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#94a3b8;font-weight:600;">${name.charAt(0).toUpperCase()}</div>`;

                    revHtml += `
                        <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;">
                            ${avatar}
                            <div style="flex:1;min-width:0;">
                                <div style="display:flex;justify-content:space-between;align-items:center;gap:4px;">
                                    <span style="font-weight:600;font-size:12px;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</span>
                                    ${rating ? `<span style="font-size:11px;color:#f59e0b;flex-shrink:0;">★ ${rating}</span>` : ''}
                                </div>
                                ${snippet ? `<div style="font-size:11px;color:#6b7280;margin-top:2px;line-height:1.4;">${snippet}</div>` : ''}
                            </div>
                        </div>`;
                });
                revHtml += `</div>`;
            }

            revHtml += `</div>`;
            html += revHtml;
        }

        return html || '<div class="popup-info" style="color:#94a3b8">No fields selected</div>';
    }

    // ── Update both panels ───────────────────────────────────────────
    function update() {
        const fields = getChecked();
        document.getElementById('code-display').innerHTML  = renderCode(fields);
        document.getElementById('popup-preview').innerHTML = renderPreview(fields);

        // Sync hidden inputs for form submit
        const container = document.getElementById('hidden-fields');
        container.innerHTML = '';
        fields.forEach(f => {
            const inp = document.createElement('input');
            inp.type = 'hidden'; inp.name = 'fields'; inp.value = f;
            container.appendChild(inp);
        });
    }

    document.querySelectorAll('.field-checkbox').forEach(cb => cb.addEventListener('change', update));
    update(); // initial render
</script>

</body>
</html>
